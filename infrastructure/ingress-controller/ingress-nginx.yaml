# infrastructure/controllers/ingress-nginx.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
spec:
  interval: 5m
  chart:
    spec:
      chart: ingress-nginx
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
      # version: "1.13.0" # 指定一個穩定的版本
  values:
    serviceAccount:
      create: true
      name: "nginx"
    controller:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: kube-prometheus-stack
      ingressClass: nginx  # default: nginx
      ingressClassByName: true
      ingressClassResource:
        name: nginx  # default: nginx
        enabled: true
        default: true
        controllerValue: "k8s.io/external-ingress-nginx"  # default: k8s.io/ingress-nginx
      config:
        annotations-risk-level: Critical
      admissionWebhooks:
        certManager:
          enabled: true
      allowSnippetAnnotations: true
      service:
        ipFamilyPolicy: "PreferDualStack"
        ipFamilies:
          - IPv4
          - IPv6
        type: LoadBalancer
        annotations:
          # metallb.io/loadBalancerIPs: 192.168.1.205
          "lbipam.cilium.io/ips": "192.168.1.205,2001:b011:700e:164d::5"
          # 若您在雲端平台上，可能需要此 annotation 來取得 Public IP
          # service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/healthz"
      replicaCount: 2 # 建議至少 2 個副本以確保高可用性
