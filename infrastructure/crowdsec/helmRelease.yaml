---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: crowdsec-helm-repo
  namespace: crowdsec
spec:
  interval: 1h
  url: https://crowdsecurity.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 1h
  chart:
    spec:
      chart: crowdsec
      sourceRef:
        kind: HelmRepository
        name: crowdsec-helm-repo
        namespace: crowdsec
      interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: crowdsec-values
