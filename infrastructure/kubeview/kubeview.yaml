# infrastructure/controllers/external-dns.yaml
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubeview
spec:
  interval: 24h
  url: https://code.benco.io/kubeview/deploy/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubeview
spec:
  interval: 5m
  chart:
    spec:
      chart: kubeview
      sourceRef:
        kind: HelmRepository
        name: kubeview
