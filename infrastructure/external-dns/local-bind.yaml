apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-local-bind
  namespace: external-dns
spec:
  interval: 5m
  chart:
    spec:
      chart: external-dns
      sourceRef:
        kind: HelmRepository
        name: external-dns
      # version: "v0.18.0" # 指定一個穩定的版本
  values:
    source:
      - service
      - ingress
    provider: rfc2136
    # 使用與 cert-manager 相同的 secret
    extraArgs:
      - --rfc2136-host=192.168.1.111
      - --rfc2136-port=53
      - --rfc2136-zone=hsinchu.pro
      - --rfc2136-zone=1.168.192.in-addr.arpa
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-axfr
      - --rfc2136-create-ptr
      - --source=gateway-httproute
      - --source=gateway-tlsroute
      # - --source=gateway-tcproute
      # - --source=gateway-udproute

    serviceMonitor:
      enabled: true
      additionalLabels:
        release: "kube-prometheus-stack"

    env:
      - name: "EXTERNAL_DNS_RFC2136_TSIG_SECRET"
        valueFrom:
          secretKeyRef:
            name: rfc2136-keys
            key: rfc2136-tsig-secret
      - name: "EXTERNAL_DNS_RFC2136_TSIG_KEYNAME"
        valueFrom:
          secretKeyRef:
            name: rfc2136-keys
            key: rfc2136-tsig-keyname
    # 限制 ExternalDNS 只管理特定網域的紀錄，避免誤操作
    domainFilters: [ 'hsinchu.pro', '1.168.192.in-addr.arpa' ]
    policy: sync # 'sync' 會同時建立與刪除紀錄, 'upsert-only' 只會建立與更新

    rbac:
      additionalPermissions:
        - apiGroups: [""]
          resources: ["namespaces"]
          verbs: ["get","watch","list"]
        - apiGroups: ["gateway.networking.k8s.io"]
          resources: ["gateways","httproutes","tlsroutes","tcproutes","udproutes"] 
          verbs: ["get","watch","list"]
