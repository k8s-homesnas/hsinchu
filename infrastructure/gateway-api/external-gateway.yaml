apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "192.168.1.205"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
    - name: https
      protocol: TLS
      port: 443
      hostname: "*.homesnas.com"
      tls:
        mode: Terminate
      allowedRoutes:
        namespaces:
          from: All
        certificateRefs:
          - name: "homesnas-com-gateway-certificates"
            kind: Secret
