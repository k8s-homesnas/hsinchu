apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vaultwarden-helm-repo
  namespace: flux-system
spec:
  interval: 30m
  url: https://gissilabs.github.io/charts/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vaultwarden-release
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/k8s-homesnas/vaultwarden.git
  secretRef:
    name: flux-system
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vaultwarden-kustomize
  namespace: flux-system
spec:
  interval: 30m
  path: ./
  prune: true
  force: false
  sourceRef:
    kind: GitRepository
    name: vaultwarden-release
