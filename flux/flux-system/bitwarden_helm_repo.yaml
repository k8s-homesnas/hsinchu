apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vaultwarden-helm-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://guerzon.github.io/vaultwarden
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vaultwarden-release
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/k8s-homesnas/vaultwarden.git
  secreteRef:
    name: my-git-auth
  ref:
    branch: main
