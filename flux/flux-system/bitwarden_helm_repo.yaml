apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vaultwarden-helm-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/guerzon/vaultwarden/charts/vaultwarden/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vaultwarden-release
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/k8s-homesnas/vaultwarden
  ref:
    branch: main
