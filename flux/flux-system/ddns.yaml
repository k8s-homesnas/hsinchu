apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudflare-ddns
  namespace: flux-system
spec:
  interval: 120m
  url: https://cloudflare-ddns.aureum.cloud
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cloudflare-ddns
  namespace: flux-system
spec:
  interval: 120m
  url: https://github.com/k8s-homesnas/cloudflare-ddns.git
  secretRef:
    name: flux-system
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-ddns
  namespace: flux-system
spec:
  interval: 120m
  path: ./
  prune: true
  force: false
  sourceRef:
    kind: GitRepository
    name: cloudflare-ddns
