apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: sandbox-v6
spec:
  addresses:
  - 2001:b011:700e:164d::/64
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: sandbox-v4
spec:
  addresses:
  - 192.168.1.200-192.168.1.254
---
# clusters/my-cluster/cilium-ip-pool.yaml
apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "sandbox"
  namespace: kube-system # 建議與 Cilium 部署在同一個 namespace
spec:
  # 停用預設的 IP 池自動建立，讓我們可以精確控制
  disabled: false
  blocks:
    # 這是您的 IPv4 位址區塊
    - start: 192.168.1.200
      stop: 192.168.1.250
    # 這是您的 IPv6 位址區塊
    - cidr: "2001:b011:700e:164d::/64" # 請根據您的本地 IPv6 網路環境修改此 CIDR


