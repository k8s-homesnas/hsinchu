apiVersion: "cilium.io/v2"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: "default-l2-policy"
  namespace: kube-system
spec:
  # 這個選擇器會選擇服務，Cilium 會自動處理服務上的 IPv4 和 IPv6 位址
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  interfaces:
    - br0
    - ^eth[0-9]+
    - ^enp.*
  externalIPs: true
  loadBalancerIPs: true
---
# clusters/my-cluster/cilium-ip-pool.yaml
apiVersion: "cilium.io/v2"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "sandbox"
  namespace: kube-system # 建議與 Cilium 部署在同一個 namespace
spec:
  # 停用預設的 IP 池自動建立，讓我們可以精確控制
  disabled: false
  blocks:
    # 這是您的 IPv4 位址區塊
    - start: 192.168.1.200
      stop: 192.168.1.250
    # 這是您的 IPv6 位址區塊
    # 請根據您的本地 IPv6 網路環境修改此 CIDR
    - cidr: "2001:b011:700e:164d::/64"
    - cidr: "fe80::abcd:0:0:0/80" 
---
