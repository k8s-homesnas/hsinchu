# cilium-values.yaml

# 1. 啟用 IPv6
ipv6:
  enabled: true

# 2. 取代 kube-proxy
kubeProxyReplacement: true

# 3. 由 Cilium 管理 Pod CIDR (IPAM)
# 模式設定為 cluster-pool
ipam:
  mode: "cluster-pool"
  operator:
    # 這裡的 CIDR 必須與 kubeadm init 時指定的 --pod-network-cidr 相符
    # podSubnet: 10.244.0.0/16,2001:db8:42:0::/56
    # serviceSubnet: 10.96.0.0/12,2001:db8:42:1::/112
    clusterPoolIPv4PodCIDRList: ["10.244.0.0/16"]
    clusterPoolIPv6PodCIDRList: ["2001:db8:42:0::/112"]

# 4. 啟用 L2 LoadBalancer 功能
l2announcements:
  enabled: true
l2NeighDiscovery:
  enabled: true

devices: 
  - br0
  - enp+
# 由於我們沒有 kube-proxy，Cilium 需要知道 API Server 的位置來進行服務發現
# 如果您的 API Server 是透過負載平衡器存取，請填寫負載平衡器的位址
k8sServiceHost: "192.168.1.111" # 替換成您主節點的 IP 或 VIP
k8sServicePort: 6443 # 預設為 6443
